<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- الكود ده بيمنع الموبايل يعمل زووم ويبوظ الأبعاد -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رسالة خاصة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #8b0000;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* تثبيت الخلفية عشان متسحبش الشاشة لبره */
        .bg-pattern {
            position: fixed; 
            top: -50%; 
            left: -50%; 
            width: 200%; 
            height: 200%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            z-index: 1;
            pointer-events: none;
            opacity: 0.12;
            transform: rotate(-25deg);
        }
        .bg-pattern span {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 20px;
            white-space: nowrap;
            user-select: none;
        }

        /* غلاف سحري بيغطي الشاشة كلها ويجبر المربع يكون في النص بالضبط */
        .wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .container {
            background-color: #8b0000;
            border: 4px solid #000000;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 85%;
            max-width: 400px;
        }

        button {
            background-color: #000000;
            color: white;
            border: 2px solid #ffffff;
            padding: 15px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            width: 100%;
        }
        button:hover {
            background-color: #333333;
            transform: scale(1.05);
        }
        .message {
            font-size: 19px;
            color: #ffffff;
            line-height: 1.8;
            white-space: pre-line;
            font-weight: 500;
        }
        .title {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .floating-item {
            position: absolute;
            user-select: none;
            pointer-events: none;
            animation: floatOut 2.5s ease-out forwards;
            z-index: 5;
            font-size: 24px;
        }
        @keyframes floatOut {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="bg-pattern" id="bgPattern"></div>

    <!-- الغلاف اللي هيسنتر الصندوق -->
    <div class="wrapper">
        <div class="container" id="mainBox">
            <button onclick="showMessage()">اضغطي يروحي ومتخافيش ❤️</button>
        </div>
    </div>

    <script>
        const bgPattern = document.getElementById('bgPattern');
        let bgText = "";
        for (let i = 0; i < 400; i++) {
            bgText += "<span>بحبك - I Love You</span>";
        }
        bgPattern.innerHTML = bgText;

        function showMessage() {
            const box = document.getElementById('mainBox');
            box.innerHTML = `
                <div class="title">فطومتي جوزتي حبيبتي 😍❤❤</div>
                <div class="message" id="msgText">
                    تكتب ليها لو عملتي اى وبكلتي مهما بلكتي وزعلتي مهما زعلتي م هسيبك بردو وم هشمتهم فيكي والله واعمل اي حاجه علشانك بس نتي الل بارده ومستفزه نتي وعيلتك كلها ومتسمعيش كلام صحابك ماشي يبنت مريم<br><br>
                    بحبك 😍😍🖐🏻
                </div>
            `;
            
            setInterval(createFloatingItems, 200);
        }

        function createFloatingItems() {
            const container = document.getElementById('mainBox');
            const rect = container.getBoundingClientRect();
            
            const item = document.createElement('div');
            item.classList.add('floating-item');
            
            const emojis = ['❤️', '💖', '😍', '💕', '🥰'];
            item.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            
            const startX = rect.left + (rect.width / 2);
            const startY = rect.top + (rect.height / 2);
            item.style.left = startX + 'px';
            item.style.top = startY + 'px';
            
            const angle = Math.random() * Math.PI * 2; 
            const distance = Math.random() * 400 + 150; 
            
            const tx = Math.cos(angle) * distance + 'px';
            const ty = Math.sin(angle) * distance + 'px';
            
            item.style.setProperty('--tx', tx);
            item.style.setProperty('--ty', ty);
            
            document.body.appendChild(item);
            
            setTimeout(() => {
                item.remove();
            }, 2500);
        }
    </script>
</body>
</html>
